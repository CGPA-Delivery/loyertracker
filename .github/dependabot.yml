version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Africa/Kinshasa
    open-pull-requests-limit: 5
    labels: [dependencies, backend]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Africa/Kinshasa
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    groups:
      # @angular/* et @angular-devkit/* doivent monter en version lock-step (peer deps
      # croisées) : un bump isolé d'un seul paquet casse `npm ci` (ERESOLVE), constaté
      # sur les PR #100/#101/#102 (2026-07-02). Ce groupe force une PR unique par cycle.
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Africa/Kinshasa
    open-pull-requests-limit: 5
    labels: [dependencies, devsecops]
    groups:
      # codeql-action/init et codeql-action/analyze doivent monter en version lock-step :
      # CodeQL échoue en « configuration error » si deux étapes du même workflow utilisent
      # des versions différentes de l'action. Constaté sur les PR #241/#243 (2026-07-26),
      # scindées par Dependabot et rouges toutes les deux. Ce groupe force une PR unique.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Africa/Kinshasa
    open-pull-requests-limit: 3
    labels: [dependencies, docker]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Africa/Kinshasa
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
