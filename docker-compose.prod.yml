name: loyertracker

# Overrides production : à utiliser avec
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Différences clés : images consommées depuis GHCR par références digest exactes (jamais `latest`,
# jamais buildées localement — ADR-08, Environment Promotion Model), Keycloak en mode production
# (start --optimized), volumes nommés persistants, aucun montage de code source.
#
# Comme en staging, définir les références du manifeste de release :
#   API_IMAGE_REF=ghcr.io/.../loyertracker-api@sha256:... \
#   WEB_IMAGE_REF=ghcr.io/.../loyertracker-web@sha256:... \
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    restart: always

  keycloak:
    # Mode production réel (`start`, SANS `--optimized`) : HTTPS/hostname gérés en amont (Nginx).
    # `--optimized` supposerait une image pré-`kc.sh build` pour Postgres ; or l'image GHCR officielle
    # est buildée par défaut sur H2 → sous `--optimized`, KC IGNORE KC_DB/KC_HEALTH_ENABLED/
    # KC_HTTP_RELATIVE_PATH au runtime et retombe sur H2 (échec JDBC observé au go-live Gate 10).
    # Sans `--optimized`, `start` ré-augmente au démarrage en honorant ces options build-time.
    command: ["start", "--import-realm", "--http-relative-path=/auth"]
    environment:
      # Le compose de base fige KC_HOSTNAME=localhost (dev). En prod : hostname public réel, sinon
      # l'issuer serait https://localhost/... et l'API rejetterait les tokens (iss ≠ ISSUER_URI).
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      # SMTP SES Mail Manager (DD-EP17-14) — relayé via sidecar Postfix car Keycloak 24
      # ne parvient pas à initialiser le mailer Quarkus/SPI directement vers SES
      # (NullPointerException dans testSMTPConnection). Le sidecar gère TLS/AUTH SES.
      KC_SPI_MAILER_DEFAULT_HOST: 'smtp-relay'
      KC_SPI_MAILER_DEFAULT_PORT: '25'
      KC_SPI_MAILER_DEFAULT_FROM: 'loyertracker@loyerpro.org'
      KC_SPI_MAILER_DEFAULT_FROM_DISPLAY_NAME: 'LoyerTracker'
      KC_SPI_MAILER_DEFAULT_REPLY_TO: 'loyertracker@loyerpro.org'
      KC_SPI_MAILER_DEFAULT_REPLY_TO_DISPLAY_NAME: 'LoyerTracker'
    volumes:
      # Realm production : sans bailleur-test@test.local (sécurité — DT-05 / R-03 audit CGPA v5.4.1).
      # Remplace le montage du fichier de base (realm-loyertracker.json qui contient le compte de test).
      # Impact : uniquement en cas de down -v + redémarrage à froid (Keycloak ignore --import-realm
      # si le realm existe déjà en base).
      - ./infra/keycloak/realm-loyertracker-production.json:/opt/keycloak/data/import/realm-loyertracker.json:ro
      # Cette liste REMPLACE (ne complète pas) celle du compose de base : le mont du thème doit
      # donc être répété ici explicitement (Lot 4, DD-EP17-01), sinon perdu en Production.
      - ./infra/keycloak/themes/loyertracker:/opt/keycloak/themes/loyertracker:ro
    restart: always

  # One-shot manuel, exclusivement déclenché après décision Gate Production DD-EP17-14 :
  # docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile production-smtp run --no-deps --rm keycloak-smtp-production-init
  # Aucun démarrage automatique et aucun secret versionné. L'option --no-deps est obligatoire :
  # ce one-shot utilise l'API Admin interne sans recréer Keycloak ni les services applicatifs.
  keycloak-smtp-production-init:
    image: quay.io/keycloak/keycloak:24.0@sha256:f8ade94c1d0ad2f2fa7734a455fee5392764f402c43ca35e9af6bf63a2541dc9
    profiles: [production-smtp]
    entrypoint: ["bash", "/opt/keycloak/data/configure-smtp-production.sh"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_PRODUCTION_CHANGE_ID: ${KC_PRODUCTION_CHANGE_ID:?Définir l'identifiant de changement Production approuvé}
      KC_SMTP_HOST: ${KC_SMTP_HOST:?Définir KC_SMTP_HOST}
      KC_SMTP_PORT: ${KC_SMTP_PORT:-587}
      KC_SMTP_USER: ${KC_SMTP_USER:?Définir KC_SMTP_USER}
      KC_SMTP_PASSWORD: ${KC_SMTP_PASSWORD:?Définir KC_SMTP_PASSWORD}
      KC_SMTP_FROM: ${KC_SMTP_FROM:?Définir KC_SMTP_FROM}
      KC_SMTP_FROM_DISPLAY: ${KC_SMTP_FROM_DISPLAY:-LoyerTracker}
      KC_SMTP_REPLY_TO: ${KC_SMTP_REPLY_TO:-${KC_SMTP_FROM}}
    volumes:
      - ./infra/keycloak/configure-smtp-production.sh:/opt/keycloak/data/configure-smtp-production.sh:ro
    depends_on:
      keycloak:
        condition: service_healthy
    networks: [loyertracker-net]
    restart: "no"

  # Rollback ciblé du changement SMTP Production. À exécuter uniquement sur instruction
  # CDO/Release Manager ; rétablit smtpServer={} sans recréer de service ni toucher aux données.
  keycloak-smtp-production-rollback:
    image: quay.io/keycloak/keycloak:24.0@sha256:f8ade94c1d0ad2f2fa7734a455fee5392764f402c43ca35e9af6bf63a2541dc9
    profiles: [production-smtp]
    entrypoint: ["bash", "/opt/keycloak/data/rollback-smtp-production.sh"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_PRODUCTION_CHANGE_ID: ${KC_PRODUCTION_CHANGE_ID:?Définir l'identifiant de changement Production approuvé}
    volumes:
      - ./infra/keycloak/rollback-smtp-production.sh:/opt/keycloak/data/rollback-smtp-production.sh:ro
    depends_on:
      keycloak:
        condition: service_healthy
    networks: [loyertracker-net]
    restart: "no"

  # Sidecar SMTP relay (DD-EP17-14) — Postfix relaye les emails de Keycloak vers SES
  # Mail Manager. Keycloak 24 ne parvient pas à initialiser le mailer Quarkus/SPI
  # directement vers SES (NullPointerException). Le sidecar gère TLS + AUTH SES.
  # Keycloak → smtp-relay:25 (pas d'auth) → SES:587 (TLS + AUTH).
  smtp-relay:
    image: boky/postfix:latest
    environment:
      # Endpoint et identifiants SES injectés exclusivement par `.env` local (mode 600).
      # Ne jamais versionner de valeur SMTP ou de fallback de credential.
      ALLOWED_SENDER_DOMAINS: loyerpro.org loyertracker.org
      RELAYHOST: ${SES_SMTP_RELAY_HOST:?Définir SES_SMTP_RELAY_HOST dans .env local}
      RELAYHOST_USERNAME: ${SES_SMTP_RELAY_USERNAME:?Définir SES_SMTP_RELAY_USERNAME dans .env local}
      RELAYHOST_PASSWORD: ${SES_SMTP_RELAY_PASSWORD:?Définir SES_SMTP_RELAY_PASSWORD dans .env local}
      MYNETWORKS: '172.0.0.0/8 127.0.0.0/8'
      # Accepter tous les destinataires (relay ouvert) — le filtrage est fait par SES
      POSTFIX_smtpd_recipient_restrictions: 'permit_mynetworks, permit_sasl_authenticated, reject_unauth_destination'
    networks: [loyertracker-net]
    restart: always

  api:
    # GHCR par digest exact — jamais un tag, jamais de build local en Production.
    image: ${API_IMAGE_REF:?Définir API_IMAGE_REF=ghcr.io/.../loyertracker-api@sha256:...}
    build: !reset null
    restart: always

  nginx:
    # Image web tirée de GHCR par digest exact.
    image: ${WEB_IMAGE_REF:?Définir WEB_IMAGE_REF=ghcr.io/.../loyertracker-web@sha256:...}
    build: !reset null
    # Ports hôte paramétrables (parité staging, lot Production Readiness 4b) pour cohabiter avec un
    # reverse-proxy mutualisé qui termine le TLS public (ex. Nginx hôte + certbot sur 80/443 →
    # conteneur sur 18080/18443). `!override` REMPLACE la liste de base (sinon Compose la concatène
    # et 80/443 subsisteraient, entrant en conflit avec le proxy hôte).
    ports: !override
      - "${WEB_HTTP_PORT:-80}:8080"
      - "${WEB_HTTPS_PORT:-443}:8443"
    volumes:
      # On ne monte plus le code : seuls la conf et les certificats sont injectés.
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    restart: always

volumes:
  postgres-data:
  keycloak-data:
