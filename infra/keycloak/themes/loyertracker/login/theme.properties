# Thème Keycloak LoyerTracker — Lot 4 (Pilote Keycloak, EP-17).
#
# Stratégie volontairement minimale (mission §17 / ADR-UI-001 §Sécurité) : `parent=keycloak`
# hérite l'intégralité des templates FreeMarker du thème par défaut (login.ftl,
# login-reset-password.ftl, logout-confirm.ftl, error.ftl, template.ftl, etc.) SANS aucune
# surcharge — zéro logique FreeMarker modifiée, donc zéro risque sur les flux OIDC/PKCE, la
# protection CSRF, les redirections ou les messages de sécurité (tous hérités tels quels).
# Seule une feuille de style est ajoutée par-dessus (Keycloak concatène `styles` du parent et
# de l'enfant — la CSS PatternFly héritée n'est jamais retirée, seulement complétée).
#
# Périmètre confirmé (gate-04A/02A-decision-ep17-lot4.md §9) : 6 écrans, tous couverts par cette
# seule feuille de style puisqu'ils partagent tous le même thème `login` et le même template.ftl :
# login, mot de passe oublié (login-reset-password.ftl), reset password, session expirée
# (login-page-expired.ftl / error.ftl), accès refusé (error.ftl), logout (logout-confirm.ftl).
parent=keycloak
import=common/keycloak

styles=css/tokens.css css/login.css
