# Inclus par nginx.conf (include /etc/nginx/admin-access.d/*.conf) uniquement lorsque ce fichier est
# monté par docker-compose.k26.yml. Sans ce montage, l'include est vide et nginx se comporte comme avant
# (dev, CI, staging : la console reste joignable, la CI en a besoin).
#
# La console d'administration Keycloak et le realm `master` ne sont pas exposés par le point d'entrée
# public. L'API applicative joint l'API Admin directement par le réseau Docker interne, sans passer par
# nginx ; l'administration se fait par un chemin non public.
location ~ ^/auth/(admin|realms/master)(/|$) {
    return 404;
}
